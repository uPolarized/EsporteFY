{% load static %}
<!-- Post Composer Modal/Form -->
<div class="card mb-3 composer-card">
    <div class="card-body p-3">
        <div class="d-flex gap-2">
            <!-- User Avatar -->
            <div class="flex-shrink-0">
                {% if request.user.perfil.foto %}
                    <img src="{{ request.user.perfil.foto.url }}" 
                         alt="{{ request.user.username }}" 
                         class="rounded-circle" 
                         style="width: 42px; height: 42px; object-fit: cover;">
                {% else %}
                    <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center" 
                         style="width: 42px; height: 42px; color: white; font-weight: bold;">
                        {{ request.user.username|first|upper }}
                    </div>
                {% endif %}
            </div>

            <!-- Form -->
            <div class="flex-grow-1">
                <form id="postComposerForm" enctype="multipart/form-data" onsubmit="enviarPost(event)" data-post-url="{% url 'social:criar_post' %}">
                    {% csrf_token %}
                    
                    <!-- Textarea -->
                    <textarea id="postConteudo" class="form-control composer-textarea" placeholder="O que está acontecendo?" rows="2" maxlength="500"></textarea>
                    
                    <!-- Character Counter -->
                    <small class="text-muted d-block mt-2">
                        <span id="charCount">0</span>/500 caracteres
                    </small>

                    <!-- Image Preview -->
                    <div id="imagePreview" style="display: none; margin-top: 10px;">
                        <img id="previewImg" src="" alt="Preview" style="max-width: 100%; max-height: 300px; border-radius: 10px;">
                        <button type="button" class="btn btn-sm btn-danger ms-2" onclick="removerImagem()">Remover imagem</button>
                    </div>

                    <!-- GIF Preview (Composer) -->
                    <div id="composerGifPreview" style="display: none; margin-top: 10px;">
                        <img id="composerGifPreviewImg" src="" alt="GIF Preview" style="max-width: 100%; max-height: 200px; border-radius: 10px;">
                        <button type="button" class="btn btn-sm btn-danger ms-2" onclick="removerGifComposer()">Remover GIF</button>
                    </div>

                    <!-- Bottom Controls -->
                    <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
                        <!-- Action Buttons -->
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-dark border-secondary" onclick="document.getElementById('postImagem').click()" title="Adicionar imagem">
                                <i class="bi bi-image text-white"></i>
                            </button>
                            <input 
                                type="file" 
                                id="postImagem" 
                                name="imagem" 
                                accept="image/*" 
                                onchange="previewImage(this)"
                                style="display: none;">

                            <button type="button" class="btn btn-dark border-secondary" onclick="PostsManager.abrirGifModal('composer')" title="Adicionar GIF">
                                <i class="bi bi-filetype-gif text-white"></i>
                            </button>

                            <input type="hidden" id="composerVisibilidade" name="visibilidade" value="publico">
                            <input type="hidden" id="composerGifUrl" name="gif_url" value="">
                        </div>

                        <!-- Submit Button -->
                        <button 
                            type="submit" 
                            class="btn btn-primary" 
                            id="submitPostBtn">
                            Postar
                        </button>
                    </div>

                    <!-- Loading State -->
                    <div id="postLoadingState" style="display: none;">
                        <div class="spinner-border spinner-border-sm" role="status">
                            <span class="visually-hidden">Enviando...</span>
                        </div>
                        <span class="ms-2">Enviando post...</span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Feedback Modal (substitui alert do navegador) -->
<div class="modal fade" id="composerFeedbackModal" tabindex="-1" aria-hidden="true" data-bs-theme="dark">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header py-2 border-secondary">
                <h5 class="modal-title" id="composerFeedbackTitle">Aviso</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <p id="composerFeedbackMessage" class="mb-0"></p>
            </div>
            <div class="modal-footer py-2 border-secondary">
                <button type="button" class="btn btn-primary btn-sm" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/pages/social-post-composer.js' %}"></script>

{% extends "account/base.html" %}
{% load static %}

{% block title %}Sair{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/login/logout.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
{% endblock %}

{% block content %}
<div class="logout-page">
    <div class="logout-card">
        <div class="icon">
            <i class="bi bi-box-arrow-right"></i>
        </div>
        <h3 class="card-title">Sair da Conta</h3>
        <p>Você tem certeza que deseja sair da sua conta no EsporteFY?</p>
        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <div class="d-grid gap-2">
                <button class="btn btn-primary" type="submit">Sim, quero sair</button>
                <a href="{% url 'feed' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
